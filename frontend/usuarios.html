<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECUAPULP - Administrar Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/estilos.css">
    <style>
        body {
            background: var(--dark-bg);
            color: var(--dark-text);
        }
        .card {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
        }
        .table {
            color: var(--dark-text);
        }
        .table thead th {
            background: #0f172a;
            color: var(--primary);
        }
        .table tbody td {
            border-bottom: 1px solid var(--dark-border);
        }
        .btn-outline-light:hover {
            background-color: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center">
                    <i class="fas fa-leaf fa-2x me-2"></i>
                    <div>
                        <span class="navbar-brand mb-0 d-block">ECUAPULP</span>
                        <small class="text-white-50">Administración de Usuarios</small>
                    </div>
                </div>
                <div>
                    <a href="/frontend/index.html" class="btn btn-outline-light btn-sm me-2">
                        <i class="fas fa-home me-1"></i>Inicio
                    </a>
                    <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                        <i class="fas fa-sign-out-alt me-1"></i>Salir
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alerta" class="alert d-none"></div>

        <div class="card mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="fas fa-user-plus me-2"></i>Nuevo Usuario</h5>
            </div>
            <div class="card-body">
                <form id="formUsuario">
                    <div class="row">
                        <div class="col-md-3">
                            <input type="text" id="username" class="form-control" placeholder="Usuario *" required>
                        </div>
                        <div class="col-md-3">
                            <input type="text" id="nombre" class="form-control" placeholder="Nombre completo">
                        </div>
                        <div class="col-md-2">
                            <input type="password" id="password" class="form-control" placeholder="Contraseña *" required>
                        </div>
                        <div class="col-md-2">
                            <select id="rol" class="form-select">
                                <option value="vendedor">Vendedor</option>
                                <option value="admin">Administrador</option>
                                <option value="contador">Contador</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-save me-1"></i>Crear Usuario
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="fas fa-users me-2"></i>Lista de Usuarios</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Nombre</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios">
                            <tr><td colspan="6" class="text-center">Cargando...</span></span>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para editar usuario -->
    <div class="modal fade" id="modalEditarUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning text-white">
                    <h5><i class="fas fa-edit me-2"></i>Editar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editUserId">
                    <div class="mb-2">
                        <label>Nombre</label>
                        <input type="text" id="editNombre" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label>Rol</label>
                        <select id="editRol" class="form-select">
                            <option value="vendedor">Vendedor</option>
                            <option value="admin">Administrador</option>
                            <option value="contador">Contador</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label>Nueva Contraseña (dejar en blanco para no cambiar)</label>
                        <input type="password" id="editPassword" class="form-control" placeholder="Nueva contraseña">
                    </div>
                    <div class="mb-2">
                        <label>Estado</label>
                        <select id="editActivo" class="form-select">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-success" onclick="actualizarUsuario()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        
        function mostrarAlerta(msg, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.className = `alert alert-${tipo}`;
            alerta.textContent = msg;
            alerta.classList.remove('d-none');
            setTimeout(() => alerta.classList.add('d-none'), 3000);
        }
        
        // Verificar rol de administrador
        const usuarioData = localStorage.getItem('usuario');
        if (usuarioData) {
            const usuario = JSON.parse(usuarioData);
            if (usuario.rol !== 'admin') {
                window.location.href = '/frontend/index.html';
            }
        } else {
            window.location.href = '/frontend/login.html';
        }
        
        async function cargarUsuarios() {
            try {
                const res = await fetch(`${API_URL}/api/usuarios`);
                if (!res.ok) throw new Error('Error al cargar usuarios');
                const usuarios = await res.json();
                const tbody = document.getElementById('tabla-usuarios');
                
                if (!usuarios.length) {
                    tbody.innerHTML = '<td><td colspan="6">No hay usuarios</span></span>';
                    return;
                }
                
                tbody.innerHTML = usuarios.map(u => `
                    <tr class="${u.activo === false ? 'table-secondary' : ''}">
                        <td>${u.id}</span>
                        <td><strong>${u.username}</strong></span>
                        <td>${u.nombre || '-'}</span>
                        <td><span class="badge bg-${u.rol === 'admin' ? 'danger' : (u.rol === 'contador' ? 'info' : 'success')}">${u.rol}</span></span>
                        <td>${u.activo !== false ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-secondary">Inactivo</span>'}</span>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editarUsuario('${u.username}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="eliminarUsuario('${u.username}')"><i class="fas fa-trash"></i></button>
                         </span>
                    </tr>
                `).join('');
            } catch (error) {
                console.error("Error:", error);
                mostrarAlerta('Error al cargar usuarios', 'danger');
            }
        }
        
        document.getElementById('formUsuario').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuario = {
                username: document.getElementById('username').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                password: document.getElementById('password').value,
                rol: document.getElementById('rol').value
            };
            
            if (!usuario.username || !usuario.password) {
                mostrarAlerta('Usuario y contraseña son requeridos', 'warning');
                return;
            }
            
            try {
                const res = await fetch(`${API_URL}/api/usuarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(usuario)
                });
                
                if (res.ok) {
                    mostrarAlerta('✅ Usuario creado', 'success');
                    document.getElementById('formUsuario').reset();
                    cargarUsuarios();
                } else {
                    const error = await res.json();
                    mostrarAlerta(error.error || 'Error al crear', 'danger');
                }
            } catch (error) {
                mostrarAlerta('Error de conexión', 'danger');
            }
        });
        
        async function editarUsuario(username) {
            try {
                const res = await fetch(`${API_URL}/api/usuarios`);
                const usuarios = await res.json();
                const usuario = usuarios.find(u => u.username === username);
                if (!usuario) throw new Error('Usuario no encontrado');
                
                document.getElementById('editUserId').value = usuario.username;
                document.getElementById('editNombre').value = usuario.nombre || '';
                document.getElementById('editRol').value = usuario.rol;
                document.getElementById('editActivo').value = usuario.activo ? 'true' : 'false';
                document.getElementById('editPassword').value = '';
                
                new bootstrap.Modal(document.getElementById('modalEditarUsuario')).show();
            } catch (error) {
                console.error(error);
                mostrarAlerta('Error al cargar usuario', 'danger');
            }
        }
        
        async function actualizarUsuario() {
            const username = document.getElementById('editUserId').value;
            const data = {
                nombre: document.getElementById('editNombre').value,
                rol: document.getElementById('editRol').value,
                activo: document.getElementById('editActivo').value === 'true'
            };
            const newPassword = document.getElementById('editPassword').value;
            if (newPassword) data.password = newPassword;
            
            try {
                const res = await fetch(`${API_URL}/api/usuarios/${username}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    mostrarAlerta('✅ Usuario actualizado', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('modalEditarUsuario')).hide();
                    cargarUsuarios();
                } else {
                    const error = await res.json();
                    mostrarAlerta(error.error || 'Error al actualizar', 'danger');
                }
            } catch (error) {
                mostrarAlerta('Error de conexión', 'danger');
            }
        }
        
        async function eliminarUsuario(username) {
            if (!confirm(`¿Eliminar usuario "${username}" permanentemente?`)) return;
            
            try {
                const res = await fetch(`${API_URL}/api/usuarios/${username}`, { method: 'DELETE' });
                if (res.ok) {
                    mostrarAlerta('✅ Usuario eliminado', 'success');
                    cargarUsuarios();
                } else {
                    const error = await res.json();
                    mostrarAlerta(error.error || 'Error al eliminar', 'danger');
                }
            } catch (error) {
                mostrarAlerta('Error de conexión', 'danger');
            }
        }
        
        function cerrarSesion() {
            localStorage.clear();
            window.location.href = '/frontend/login.html';
        }
        
        // Inicializar
        cargarUsuarios();
    </script>
</body>
</html>
