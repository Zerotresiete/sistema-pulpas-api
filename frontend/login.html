<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECUAPULP - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }
        .login-card h2 {
            color: #10b981;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .login-card .subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .login-card .form-control {
            background: #334155;
            border: 1px solid #475569;
            color: white;
        }
        .login-card .form-control:focus {
            background: #334155;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.2);
            color: white;
        }
        .login-card .form-label {
            color: #e2e8f0;
        }
        .login-card .btn-success {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border: none;
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
            color: white;
        }
        .login-card .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16,185,129,0.4);
        }
        .input-group .btn-outline-secondary {
            background: #334155;
            border-color: #475569;
            color: #94a3b8;
        }
        .input-group .btn-outline-secondary:hover {
            background: #475569;
            border-color: #10b981;
            color: #10b981;
        }
        .slogan {
            text-align: center;
            margin-top: 1.5rem;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .alert {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-3">
            <i class="fas fa-leaf fa-3x text-success"></i>
        </div>
        <h2>ECUAPULP</h2>
        <div class="subtitle">Sistema de Control de Inventario</div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" placeholder="Ingrese su usuario" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-success">
                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
            </button>
        </form>
        
        <div id="alerta" class="alert alert-danger d-none mt-3"></div>
        
        <div class="slogan">
            🇪🇨 Puro sabor de tu tierra
        </div>
        <div class="text-center mt-3" style="font-size: 0.9rem; color: #a0aec0;">
            <i class="fas fa-laptop-code"></i> Desarrollado por <strong style="font-size: 1rem; color: #10b981;">Leonardo Narváez</strong> | © 2026
        </div>
    </div>

    <script>
        // Mostrar/ocultar contraseña
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (togglePassword) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                if (type === 'text') {
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                } else {
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                }
            });
        }
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alerta = document.getElementById('alerta');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = '/frontend/index.html';
                } else {
                    alerta.textContent = data.error || 'Error de autenticación';
                    alerta.classList.remove('d-none');
                }
            } catch (error) {
                alerta.textContent = 'Error de conexión';
                alerta.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
